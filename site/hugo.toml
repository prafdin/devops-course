# Item pages (lectures/assignments/extras) intentionally have no
# layouts/_default/single.html — there's no per-item HTML page, only
# PDF links via the topic/year pages. Disabling sitemap/RSS avoids
# advertising those non-existent URLs.
disableKinds = ["taxonomy", "sitemap", "RSS"]

[taxonomies]
  topic = "topics"
