{{ define "main" }}
<h1>{{ site.Title }}</h1>
<p class="subtitle">Слайды лекций и методички лабораторных работ</p>
<div class="year-grid">
{{ range (sort .Site.Sections "Title" "desc") }}
  <a class="year-card" href="{{ .RelPermalink }}">
    <span class="year-card-number">{{ .Title }}</span>
    <span class="year-card-label">год прочтения</span>
  </a>
{{ end }}
</div>
{{ end }}
