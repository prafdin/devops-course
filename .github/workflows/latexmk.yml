---
name: latexmk
'on':
  push:
    branches:
      - master
jobs:
  latexmk:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update --yes --fix-missing && sudo apt-get install --yes wget
      - uses: yegor256/latexmk-action@0.16.1
        with:
          cmd: make
          depends: DEPENDS.txt
      - uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: package
          clean: false
        if: github.ref == 'refs/heads/master'